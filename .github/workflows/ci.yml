name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jogo:
    name: tipos, testes e HTML portátil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar
        run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: HTML portátil
        run: npm run portatil
      - name: Tamanho
        run: node scripts/tamanho.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar o HTML portátil
        uses: actions/upload-artifact@v4
        with:
          name: oficina-de-materiais-portatil
          path: portatil/
          if-no-files-found: error
